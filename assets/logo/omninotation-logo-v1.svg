<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    OmniNotation Logo v1 — 矢量定稿（方案 B：KnoWeave 双色调）
    色值经逐像素校验，与 KnoWeave 品牌色板精确一致，零偏差。
    几何依据 assets/logo/SPEC.md（横条宽度已按椭圆内腔重新计算，见下）。
  -->
  <defs>
    <!-- 断口遮罩：仅挖掉环的右上 45° 楔形，不影响内部横条 -->
    <mask id="gapMask">
      <rect x="0" y="0" width="1024" height="1024" fill="#fff"/>
      <path d="M 511.5 443 L 820 443 L 820 190 Z" fill="#000"/>
    </mask>
  </defs>

  <!-- 标志图形 -->
  <g id="mark">
    <!-- 椭圆环：中心 (511.5,443)，中线半轴 227×173（椭圆率 0.763），线宽 50 -->
    <ellipse cx="511.5" cy="443" rx="227" ry="173"
             fill="none" stroke="#14B8A6" stroke-width="50"
             mask="url(#gapMask)"/>

    <!-- 被圈注的两行文字。
         宽度受椭圆内腔约束：内腔半轴 202×148，
         条带最窄处可用全宽 358.8 / 348.3，两侧各留 8 间隙 → 343 / 332。
         ⚠️ 不可加宽，否则会与环相接或溢出。 -->
    <g fill="#14B8A6">
      <rect x="340" y="375" width="343" height="53"/>
      <rect x="346" y="465" width="332" height="53"/>
    </g>

    <!-- 收笔圆点：⌀77，圆心 (678,306)，深松绿。置于遮罩之外 -->
    <circle cx="678" cy="306" r="38.5" fill="#064E3B"/>
  </g>

  <!--
    标准字：以下为可渲染版本（依赖系统无衬线字体）。
    正式物料请在 Figma/Illustrator 中以 Archivo/Inter 中等字重转曲后替换，
    以保证跨平台字形一致。占位区：x 93-927, y 666-765。
  -->
  <text id="wordmark" x="510" y="765" font-size="118" fill="#064E3B"
        text-anchor="middle" letter-spacing="-0.6"
        font-family="Archivo, Inter, 'Helvetica Neue', Arial, sans-serif"
        font-weight="600">OmniNotation</text>
</svg>
